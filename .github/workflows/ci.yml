name: Security CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  security-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true

      - name: Checkov ${{ matrix.env }} (non-prod)
        if: matrix.env != 'prod'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/${{ matrix.env }}/
          framework: terraform
          soft_fail: true

      - name: Checkov ${{ matrix.env }} (prod)
        if: matrix.env == 'prod'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/${{ matrix.env }}/
          framework: terraform
          soft_fail: false

      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          exit-code: 1
          severity: CRITICAL,HIGH

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init ${{ matrix.env }}
        run: terraform -chdir=environments/${{ matrix.env }} init

      - name: Terraform Fmt ${{ matrix.env }}
        run: terraform -chdir=environments/${{ matrix.env }} fmt -check

      - name: Terraform Validate ${{ matrix.env }}
        run: terraform -chdir=environments/${{ matrix.env }} validate

      - name: Terraform Plan ${{ matrix.env }} (non-prod)
        if: matrix.env != 'prod'
        run: terraform -chdir=environments/${{ matrix.env }} plan -no-color

      - name: Terraform Plan ${{ matrix.env }} (prod)
        if: matrix.env == 'prod'
        env:
          TF_VAR_rds_password: ${{ secrets.RDS_PASSWORD }}
        run: terraform -chdir=environments/${{ matrix.env }} plan -no-color